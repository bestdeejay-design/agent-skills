<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Презентация</title>
<!--FONT_LINK-->
<style>
:root {
    --primary: #007AFF;
    --background: #FFFFFF;
    --card: #F5F5F7;
    --stroke: #E5E5EA;
    --on-primary: #FFFFFF;
    --text: #1C1C1E;
    --muted: #6E6E73;
    --accent-soft: #E8F0FE;
    --graph-0: #007AFF;
    --graph-1: #30B0C7;
    --graph-2: #5E5CE6;
    --graph-3: #34C759;
    --graph-4: #FF9500;
    --radius: 20px;
    --radius-sm: 12px;
    --radius-lg: 28px;
    --radius-full: 999px;
    --shadow: 0 8px 32px rgba(0,0,0,.06), 0 2px 8px rgba(0,0,0,.04);
    --shadow-hover: 0 16px 48px rgba(0,0,0,.1), 0 4px 16px rgba(0,0,0,.06);
    --shadow-soft: 0 1px 2px rgba(0,0,0,.04), 0 2px 10px rgba(0,0,0,.05);
    --font: "Inter", -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", Roboto, system-ui, sans-serif;
    --font-display: var(--font);
    --font-mono: "JetBrains Mono", ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;

    /* Design-system: spacing scale (4px base) */
    --s-1: 4px; --s-2: 8px; --s-3: 12px; --s-4: 16px; --s-5: 24px;
    --s-6: 32px; --s-7: 48px; --s-8: 64px; --s-9: 96px;

    /* Design-system: type scale (1600x900) */
    --t-display: clamp(52px, 8vw, 104px);
    --t-h1: clamp(44px, 6vw, 76px);
    --t-h2: clamp(30px, 4vw, 50px);
    --t-h3: clamp(19px, 2.4vw, 26px);
    --t-body: clamp(16px, 1.8vw, 19px);
    --t-meta: clamp(13px, 1.5vw, 16px);
    --t-caption: clamp(11px, 1.2vw, 13px);

    /* Design-system: contrast (WCAG) & hierarchy knobs */
    --eyebrow-track: .18em;
    --eyebrow-size: clamp(11px, 1.2vw, 13px);
    --duotone-a: var(--primary);
    --duotone-b: var(--graph-1);
    --grid-margin: clamp(56px, 6vw, 88px);
    --hairline: 1px solid var(--stroke);
}
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { height: 100%; overflow: hidden; background: var(--background); color: var(--text);
    font-family: var(--font); -webkit-font-smoothing: antialiased; }
.deck { height: 100%; width: 100%; position: relative; }

.slide {
    position: absolute; inset: 0; display: flex; flex-direction: column;
    justify-content: center; align-items: center; padding: clamp(56px, 6vw, 88px);
    opacity: 0; visibility: hidden; transform: translateX(40px);
    transition: opacity .4s cubic-bezier(.22,1,.36,1), transform .4s cubic-bezier(.22,1,.36,1), visibility .4s;
}
.slide.active { opacity: 1; visibility: visible; transform: none; z-index: 1; }

.slide-head { position: absolute; top: 28px; left: 32px; right: 32px; display: flex;
    justify-content: space-between; align-items: center; pointer-events: none; }
.slide-head .logo { width: 30px; height: 30px; border-radius: 8px; display: inline-flex;
    align-items: center; justify-content: center; font-weight: 800; font-size: 15px;
    background: linear-gradient(135deg, var(--primary), var(--graph-1)); color: var(--on-primary); }
.slide-head .page-ind { font-weight: 700; font-size: 13px; color: var(--muted); opacity: .7;
    letter-spacing: .08em; }

h1, h2, h3 { font-weight: 800; letter-spacing: -.025em; line-height: 1.08; color: var(--text); }
h1 { font-size: clamp(44px, 6vw, 76px); margin-bottom: 16px; }
h2 { font-size: clamp(30px, 4vw, 50px); margin-bottom: 12px; text-align: center; }
h3 { font-size: clamp(19px, 2.4vw, 26px); font-weight: 700; }
.subtitle { font-size: clamp(17px, 2.1vw, 23px); color: var(--muted); font-weight: 500;
    line-height: 1.32; margin-top: 8px; max-width: 900px; }
.meta-line { font-size: clamp(14px, 1.6vw, 18px); color: var(--muted); font-weight: 500;
    margin-top: 28px; opacity: .8; letter-spacing: .02em; }
.accent { color: var(--primary); }
.slide.title, .slide.closing, .slide.centered-header { text-align: center; }

/* gradient accent bar on title/closing */
.slide.title h1::after, .slide.closing h1::after {
    content: ""; display: block; width: 64px; height: 5px; border-radius: 3px; margin: 18px auto 0;
    background: linear-gradient(90deg, var(--primary), var(--graph-1));
}

/* bullets */
.bullet-list { list-style: none; display: flex; flex-direction: column; gap: 14px;
    width: 100%; max-width: 920px; margin-top: 26px; text-align: left; }
.bullet-list li { display: flex; align-items: center; gap: 16px; padding: 18px 24px;
    background: var(--card); border: 1px solid var(--stroke); border-radius: var(--radius-sm);
    font-size: clamp(15px, 1.8vw, 19px); line-height: 1.5; transition: border-color .2s, box-shadow .2s; }
.bullet-list li:hover { border-color: var(--primary); box-shadow: var(--shadow); }
.bullet-list li::before { content: ""; flex-shrink: 0; width: 10px; height: 10px; border-radius: 50%;
    background: var(--primary); box-shadow: 0 0 0 5px var(--accent-soft); }

/* metrics */
.metrics-grid { display: grid; gap: 20px; width: 100%; max-width: 1100px; margin-top: 30px; }
.metrics-2 { grid-template-columns: repeat(2, 1fr); }
.metrics-3 { grid-template-columns: repeat(3, 1fr); }
.metrics-4 { grid-template-columns: repeat(4, 1fr); }
.metric-card { display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 6px; padding: clamp(24px, 3vw, 36px); background: var(--card); border: 1px solid var(--stroke);
    border-radius: var(--radius); transition: transform .25s ease, box-shadow .25s ease, border-color .25s ease;
    min-width: 0; }
.metric-card:hover { transform: translateY(-4px); box-shadow: var(--shadow-hover); border-color: var(--primary); }
.metric-icon { width: 52px; height: 52px; border-radius: 14px; display: flex; align-items: center;
    justify-content: center; margin-bottom: 6px; color: var(--primary); background: var(--card);
    border: 1px solid var(--stroke); }
.metric-icon svg { width: 24px; height: 24px; display: block; }
.metric-value { font-size: clamp(26px, 3.4vw, 44px); font-weight: 800; letter-spacing: -.02em;
    color: var(--primary); line-height: 1.1; text-align: center; overflow-wrap: anywhere; max-width: 100%; }
.metric-value-sm { font-size: clamp(19px, 2.2vw, 27px); letter-spacing: -.01em; }
.metric-label { font-size: clamp(13px, 1.5vw, 16px); color: var(--muted); font-weight: 500;
    text-align: center; line-height: 1.3; }
@media (max-width: 900px) {
    .metrics-3, .metrics-4 { grid-template-columns: repeat(2, 1fr); }
}

/* comparison */
.columns { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
    gap: clamp(18px, 2.5vw, 30px); width: 100%; max-width: 1100px; margin-top: 28px; }
.col-card { display: flex; flex-direction: column; background: var(--card);
    border: 1px solid var(--stroke); border-radius: var(--radius); padding: 28px 28px 22px;
    transition: border-color .2s, box-shadow .2s; }
.col-card:hover { border-color: var(--primary); box-shadow: var(--shadow); }
.col-card h3 { margin-bottom: 18px; padding-bottom: 12px; border-bottom: 1px solid var(--stroke); }
.col-card h3::before { content: "— "; color: var(--muted); font-weight: 600; opacity: .6; }
.col-card li { list-style: none; display: flex; align-items: flex-start; gap: 12px;
    padding: 10px 0; font-size: clamp(14px, 1.7vw, 17px); line-height: 1.45; }
.col-card li::before { content: "✕"; flex-shrink: 0; width: 22px; height: 22px; border-radius: 50%;
    display: inline-flex; align-items: center; justify-content: center; font-size: 11px; font-weight: 700;
    background: rgba(255,59,48,.12); color: #FF3B30; margin-top: 2px; }
.col-card:nth-child(2) li::before { content: "✓"; background: rgba(52,199,89,.14); color: var(--graph-3); }
.col-card:nth-child(2) h3::before { content: "→ "; color: var(--primary); opacity: 1; }

/* table */
.table-wrap { width: 100%; max-width: 980px; margin-top: 26px; overflow: auto; }
table { width: 100%; border-collapse: separate; border-spacing: 0 8px;
    font-size: clamp(14px, 1.6vw, 16px); }
th { padding: 12px 20px; text-align: left; font-weight: 700; font-size: clamp(11px, 1.3vw, 13px);
    text-transform: uppercase; letter-spacing: .08em; color: var(--muted); }
td { padding: 15px 20px; background: var(--card); border: 1px solid var(--stroke); }
tr td:first-child { border-radius: var(--radius-sm) 0 0 var(--radius-sm); font-weight: 600; }
tr td:last-child { border-radius: 0 var(--radius-sm) var(--radius-sm) 0; color: var(--muted); }
tr:hover td { border-color: var(--primary); }
/* highlighted column (e.g. "us" column in a comparison table) */
th.hl { color: var(--primary); }
th.hl, td.hl { background: var(--accent-soft); }
tr td.hl { color: var(--primary); font-weight: 700; }
tr:hover td.hl { border-color: var(--primary); }

/* chart */
.chart-wrap { display: flex; align-items: flex-end; gap: clamp(14px, 2vw, 26px);
    width: 100%; max-width: 980px; height: 320px; margin-top: 28px; padding: 0 8px; }
.bar-col { flex: 1; display: flex; flex-direction: column; align-items: center; gap: 10px; height: 100%; }
.bar { width: min(56px, 70%); border-radius: 8px 8px 3px 3px;
    background: linear-gradient(180deg, var(--graph-0), var(--graph-1)); transition: height .8s cubic-bezier(.22,1,.36,1); }
.bar-2 { background: linear-gradient(180deg, var(--graph-2), var(--graph-3)); }
.bar-3 { background: linear-gradient(180deg, var(--graph-1), var(--graph-4)); }
.bar-label { font-size: clamp(12px, 1.4vw, 14px); color: var(--muted); font-weight: 600; }
.bar-value { font-size: clamp(15px, 1.8vw, 19px); color: var(--text); font-weight: 800;
    letter-spacing: -.01em; font-variant-numeric: tabular-nums; }
.chart-note { margin-top: var(--s-6); font-size: clamp(14px, 1.6vw, 17px);
    color: var(--muted); font-weight: 500; text-align: center; max-width: 900px; line-height: 1.4; }

/* process / steps */
.steps { display: flex; flex-direction: column; gap: 14px; width: 100%; max-width: 920px;
    margin-top: 26px; position: relative; }
.step-card { display: flex; align-items: center; gap: 22px; padding: 20px 26px;
    background: var(--card); border: 1px solid var(--stroke); border-radius: var(--radius);
    transition: border-color .2s, box-shadow .2s, transform .2s; position: relative; }
.step-card:hover { border-color: var(--primary); box-shadow: var(--shadow-hover); transform: translateX(4px); }
.step-num { flex-shrink: 0; width: 46px; height: 46px; border-radius: 13px; display: flex;
    align-items: center; justify-content: center; font-weight: 800; font-size: 17px; color: var(--on-primary);
    background: linear-gradient(135deg, var(--primary), var(--graph-1));
    box-shadow: 0 4px 14px color-mix(in srgb, var(--primary) 40%, transparent); }
.step-text { font-size: clamp(15px, 1.8vw, 18px); line-height: 1.45; font-weight: 500; text-align: left; }
.step-arrow { position: absolute; right: 22px; color: var(--muted); opacity: .5; font-size: 20px; }

/* timeline */
.timeline { display: flex; gap: 0; width: 100%; max-width: 1100px; margin-top: 30px;
    position: relative; justify-content: space-between; }
.timeline::before { content: ""; position: absolute; top: 22px; left: 6%; right: 6%; height: 3px;
    background: var(--accent-soft); border-radius: 2px; }
.tl-item { flex: 1; display: flex; flex-direction: column; align-items: center; gap: 14px;
    text-align: center; padding: 0 10px; }
.tl-dot { width: 46px; height: 46px; border-radius: 50%; display: flex; align-items: center;
    justify-content: center; font-weight: 800; font-size: 15px; color: var(--on-primary);
    background: linear-gradient(135deg, var(--primary), var(--graph-1));
    box-shadow: 0 0 0 6px var(--accent-soft); z-index: 1; }
.tl-card { width: 100%; background: var(--card); border: 1px solid var(--stroke);
    border-radius: var(--radius); padding: 18px 16px; transition: border-color .2s, box-shadow .2s; }
.tl-card:hover { border-color: var(--primary); box-shadow: var(--shadow); }
.tl-card strong { display: block; font-size: clamp(14px, 1.6vw, 17px); margin-bottom: 4px; }
.tl-card span { font-size: clamp(12px, 1.4vw, 14px); color: var(--muted); line-height: 1.4; display: block; }

/* image showcase */
.showcase { display: grid; grid-template-columns: 1fr 1fr; gap: clamp(24px, 3vw, 40px);
    width: 100%; max-width: 1100px; margin-top: 26px; align-items: center; }
.showcase-media { aspect-ratio: 16/10; border-radius: var(--radius); overflow: hidden;
    background: linear-gradient(135deg, var(--accent-soft), color-mix(in srgb, var(--primary) 18%, var(--card)));
    border: 1px solid var(--stroke); display: flex; align-items: center; justify-content: center;
    font-size: 56px; box-shadow: var(--shadow); }
.showcase-media img { width: 100%; height: 100%; object-fit: cover; }
.showcase-body h2 { text-align: left; margin-bottom: 16px; }
.showcase-body p { font-size: clamp(15px, 1.8vw, 18px); color: var(--muted); line-height: 1.55; }

/* kpi row */
.kpi-row { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
    gap: 18px; width: 100%; max-width: 1100px; margin-top: 28px; }
.kpi-card { padding: 24px 20px; background: var(--card); border: 1px solid var(--stroke);
    border-radius: var(--radius); text-align: center; transition: transform .25s, box-shadow .25s; }
.kpi-card:hover { transform: translateY(-4px); box-shadow: var(--shadow-hover); }
.kpi-value { font-size: clamp(30px, 4vw, 52px); font-weight: 800; letter-spacing: -.03em;
    color: var(--primary); line-height: 1.1; }
.kpi-label { font-size: clamp(13px, 1.5vw, 15px); color: var(--muted); margin-top: 6px; }

/* centered header */
.centered-header .subtitle-panel { margin: 22px auto 0; max-width: 760px; padding: 16px 28px;
    background: var(--accent-soft); border-radius: var(--radius-sm); font-size: clamp(15px, 1.8vw, 18px);
    color: var(--text); line-height: 1.5; }

/* closing */
.slide.closing h1 { margin-bottom: 0; }
.slide.closing .subtitle { margin-top: 20px; }

/* badges (optional) */
.badges { display: flex; flex-wrap: wrap; gap: 10px; justify-content: center; margin-top: 22px; }
.badge { padding: 8px 16px; border-radius: 100px; background: var(--card);
    border: 1px solid var(--stroke); font-size: clamp(12px, 1.4vw, 14px); font-weight: 600;
    color: var(--muted); }

/* ===== quote — крупный assertion-вывод ===== */
.quote-slide { text-align: center; max-width: 980px; }
.quote-mark { font-family: var(--font-display); font-size: clamp(64px, 9vw, 120px); line-height: .6;
    color: var(--primary); display: block; margin-bottom: var(--s-5); opacity: .9; }
.quote-text { font-family: var(--font-display); font-size: clamp(28px, 4vw, 48px); font-weight: 800;
    letter-spacing: -.02em; line-height: 1.18; color: var(--text); max-width: 900px; margin: 0 auto; }
.quote-attrib { margin-top: var(--s-5); color: var(--muted); font-size: clamp(15px, 1.7vw, 18px);
    font-weight: 500; }
.quote-attrib::before { content: "— "; }

/* ===== big-number — гигантский hero-показатель ===== */
.hero-num { text-align: center; }
.hero-num .hero-value { font-family: var(--font-mono); font-size: clamp(96px, 20vw, 220px);
    font-weight: 800; line-height: .9; letter-spacing: -.04em;
    background: linear-gradient(135deg, var(--text), var(--muted));
    -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent; }
.hero-num .hero-value--accent {
    background: linear-gradient(135deg, var(--primary), var(--graph-1));
    -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent; }
.hero-num .hero-label { margin-top: var(--s-4); font-size: clamp(20px, 2.6vw, 30px);
    font-weight: 600; color: var(--muted); }
.hero-num .hero-sub { margin-top: var(--s-2); font-size: clamp(14px, 1.6vw, 18px);
    color: var(--muted); opacity: .75; max-width: 640px; margin-left: auto; margin-right: auto; }

/* ===== feature — сетка возможностей (иконка+заголовок+текст) ===== */
.feature-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
    gap: clamp(16px, 2vw, 24px); width: 100%; max-width: 1120px; margin-top: var(--s-6); }
.feature-card { display: flex; flex-direction: column; gap: var(--s-3); padding: clamp(22px, 2.6vw, 32px);
    background: var(--card); border: 1px solid var(--stroke); border-radius: var(--radius); text-align: left;
    transition: border-color .2s, box-shadow .2s, transform .25s; }
.feature-card:hover { border-color: var(--primary); box-shadow: var(--shadow-hover); transform: translateY(-4px); }
.feature-icon { width: 48px; height: 48px; border-radius: 12px; display: flex; align-items: center;
    justify-content: center; color: var(--primary); background: var(--accent-soft); }
.feature-icon svg { width: 22px; height: 22px; display: block; }
.feature-card h3 { font-size: clamp(17px, 2vw, 22px); font-weight: 700; }
.feature-card p { font-size: clamp(14px, 1.6vw, 16px); color: var(--muted); line-height: 1.5; }

/* ===== logos — сетка партнёров/брендов ===== */
.logo-grid { display: flex; flex-wrap: wrap; justify-content: center; gap: clamp(14px, 2vw, 24px);
    width: 100%; max-width: 1000px; margin-top: var(--s-6); }
.logo-tile { min-width: 150px; padding: clamp(16px, 2vw, 24px) clamp(20px, 2.5vw, 32px);
    background: var(--card); border: 1px solid var(--stroke); border-radius: var(--radius);
    display: flex; align-items: center; justify-content: center; font-weight: 700;
    font-size: clamp(14px, 1.8vw, 18px); color: var(--muted);
    transition: border-color .2s, color .2s, transform .25s; text-align: center; }
.logo-tile:hover { border-color: var(--primary); color: var(--text); transform: translateY(-3px); }
.logo-note { margin-top: var(--s-4); font-size: clamp(12px, 1.4vw, 14px); color: var(--muted); opacity: .8; text-align: center; }

/* ===== table-of-contents — оглавление/агенда ===== */
.toc-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
    gap: clamp(14px, 2vw, 22px); width: 100%; max-width: 1000px; margin-top: var(--s-6); }
.toc-item { display: flex; gap: var(--s-4); align-items: baseline; padding: var(--s-4) var(--s-5);
    background: var(--card); border: 1px solid var(--stroke); border-radius: var(--radius-sm);
    transition: border-color .2s, transform .2s; }
.toc-item:hover { border-color: var(--primary); transform: translateX(4px); }
.toc-num { font-family: var(--font-mono); font-weight: 800; font-size: clamp(16px, 1.9vw, 22px);
    color: var(--primary); min-width: 2ch; }
.toc-title { font-size: clamp(16px, 1.9vw, 20px); font-weight: 700; }
.toc-desc { font-size: clamp(13px, 1.5vw, 15px); color: var(--muted); margin-top: 2px; }

/* ===== feature list — слева текст, справа ключевые пункты с галочками ===== */
.hero .feature-list { list-style: none; display: flex; flex-direction: column; gap: var(--s-3);
    margin-top: var(--s-5); text-align: left; max-width: 720px; margin-left: auto; margin-right: auto; }
.feature-list li { display: flex; align-items: center; gap: var(--s-3); padding: var(--s-3) var(--s-4);
    background: var(--card); border: 1px solid var(--stroke); border-radius: var(--radius-sm);
    font-size: clamp(15px, 1.8vw, 18px); font-weight: 500; }
.feature-list li::before { content: ""; flex-shrink: 0; width: 22px; height: 22px; border-radius: 50%;
    background: var(--graph-3); color: var(--background);
    background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='white' stroke-width='3.5' stroke-linecap='round' stroke-linejoin='round'><path d='M20 6L9 17l-5-5'/></svg>");
    background-size: 12px; background-position: center; background-repeat: no-repeat; }

/* progress bar */
.progress { position: fixed; top: 0; left: 0; height: 3px; background: linear-gradient(90deg, var(--primary), var(--graph-1));
    z-index: 60; transition: width .35s cubic-bezier(.22,1,.36,1); }

/* nav hint */
.nav-hint { position: fixed; bottom: 18px; left: 50%; transform: translateX(-50%);
    color: var(--muted); opacity: .55; font-size: 12px; letter-spacing: .04em;
    user-select: none; pointer-events: none; white-space: nowrap; }

@media (max-width: 820px) {
    .showcase { grid-template-columns: 1fr; }
    .timeline { flex-direction: column; gap: 16px; }
    .timeline::before { display: none; }
    .bullet-list li { align-items: flex-start; }
}
/* ===== Design-system: typographic helpers ===== */
/* eyebrow / kicker — маленький капс-лейбл над заголовком */
.eyebrow, .kicker { display: inline-block; font-family: var(--font-display);
    font-size: var(--eyebrow-size); font-weight: 700; letter-spacing: var(--eyebrow-track);
    text-transform: uppercase; text-align: center; color: var(--muted);
    margin-bottom: var(--s-3); }
.eyebrow--accent { color: var(--primary); }
/* mono numbers for metrics/timeline labels */
.mono { font-family: var(--font-mono); font-variant-numeric: tabular-nums; }
/* hairline divider */
.hairline { border: 0; border-top: var(--hairline); margin: var(--s-5) auto; width: 100%; }

/* duotone image tint — Stripe/Duolingo editorial look
   Обёртка: <div class="duotone" style="background: var(--duotone-a)"><img ...></div>
   Фото/моно тонируется двумя брендовыми тонами через blend. */
.duotone { position: relative; overflow: hidden; }
.duotone img { width: 100%; height: 100%; object-fit: cover; filter: grayscale(1) contrast(1.12); mix-blend-mode: multiply; opacity: .94; }
.duotone::after { content: ""; position: absolute; inset: 0;
    background: linear-gradient(120deg, var(--duotone-a), var(--duotone-b));
    mix-blend-mode: screen; opacity: .55; pointer-events: none; }

/* index numerals (editorial / swiss) — большой серийный номер */
.index-num { position: absolute; top: var(--s-4); right: var(--s-6); font-family: var(--font-mono);
    font-size: clamp(56px, 7vw, 96px); font-weight: 800; color: var(--stroke); opacity: .55; line-height: 1; }

/* ===== design-system: aesthetic moods (data-mood) =====
   Каждый mood переопределяет характер шаблона ПОВЕРХ темы через токены.
   Применяется к блоку .deck (атрибут data-mood выбрал build_html по темы/mood). */

/* SWISS — International Typographic: острая сетка, хайр-лайны, жёсткие радиусы, красный акцент */
.deck[data-mood="swiss"] {
    --radius: 6px; --radius-sm: 2px; --radius-lg: 6px;
    --eyebrow-track: .12em;
    --shadow: none; --shadow-hover: 0 4px 20px rgba(0,0,0,.08);
    --font-display: var(--font);
}
.deck[data-mood="swiss"] h1, .deck[data-mood="swiss"] h2, .deck[data-mood="swiss"] h3 { letter-spacing: -.015em; }
.deck[data-mood="swiss"] .metric-value, .deck[data-mood="swiss"] .kpi-value { letter-spacing: -.02em; font-variant-numeric: tabular-nums; }
.deck[data-mood="swiss"] .bullet-list li, .deck[data-mood="swiss"] .col-card,
.deck[data-mood="swiss"] .step-card, .deck[data-mood="swiss"] .tl-card,
.deck[data-mood="swiss"] .kpi-card { border-width: 1px; border-radius: var(--radius); box-shadow: none; }

/* EDITORIAL / DUOTONE — журнальная полоса: сериф-дисплей, воздух, даутон, индекс-номера */
.deck[data-mood="editorial"] {
    --radius: 4px; --radius-sm: 2px; --radius-lg: 6px;
    --shadow: var(--shadow-soft); --shadow-hover: 0 12px 32px rgba(0,0,0,.12);
    --eyebrow-track: .08em;
}
.deck[data-mood="editorial"] h1, .deck[data-mood="editorial"] h2 { letter-spacing: -.005em; font-family: var(--font-display); }
.deck[data-mood="editorial"] .slide-head { top: var(--s-5); left: var(--s-6); right: var(--s-6); }

/* FLAT / UI-KIT — Linear-бенто: мягкие крупные радиусы, почти без теней, тонкие линии */
.deck[data-mood="flat"] {
    --radius: 20px; --radius-sm: 14px; --radius-lg: 28px;
    --shadow: none; --shadow-hover: 0 8px 24px rgba(0,0,0,.07);
    --eyebrow-track: .16em;
}
.deck[data-mood="flat"] .bullet-list li, .deck[data-mood="flat"] .col-card,
.deck[data-mood="flat"] .step-card, .deck[data-mood="flat"] .tl-card,
.deck[data-mood="flat"] .kpi-card { box-shadow: none; }
.deck[data-mood="flat"] .metric-icon { border-radius: var(--radius-sm); }

/* GLASS — glassmorphism: полупрозрачные карточки над градиентным фоном */
.deck[data-mood="glass"] {
    --radius: 24px; --radius-sm: 16px; --radius-lg: 32px;
    --shadow: 0 8px 32px rgba(0,0,0,.14), inset 0 1px 0 rgba(255,255,255,.18);
    --shadow-hover: 0 16px 48px rgba(0,0,0,.2), inset 0 1px 0 rgba(255,255,255,.2);
}
.deck[data-mood="glass"] .metric-card, .deck[data-mood="glass"] .col-card,
.deck[data-mood="glass"] .step-card, .deck[data-mood="glass"] .tl-card,
.deck[data-mood="glass"] .kpi-card, .deck[data-mood="glass"] .bullet-list li {
    background: color-mix(in srgb, var(--card) 68%, transparent);
    -webkit-backdrop-filter: blur(18px); backdrop-filter: blur(18px);
    border: 1px solid color-mix(in srgb, var(--stroke) 55%, transparent);
}

/* DARK CONSOLE — developer: тёмный фон, неоновые акценты, моно-числа */
.deck[data-mood="dark"] {
    --radius: 16px; --radius-sm: 10px; --radius-lg: 22px;
    --eyebrow-track: .14em;
    --font-display: var(--font);
}
.deck[data-mood="dark"] .metric-value, .deck[data-mood="dark"] .kpi-value { font-family: var(--font-mono); letter-spacing: -.02em; }
.deck[data-mood="dark"] .step-num, .deck[data-mood="dark"] .tl-dot { color: var(--background);
    box-shadow: 0 0 0 6px color-mix(in srgb, var(--primary) 14%, transparent); }

/* Готовые комбинации шрифт-семейств для важных mood
   (display назначается из темы как --font-display и/или --font). */
</style>
</head>
<body>
<div class="progress" id="progress"></div>
<div class="deck" id="deck">

  <section class="slide title active">
    <div class="slide-head"><span class="logo">◆</span><span class="page-ind">01</span></div>
    <h1>Презентация</h1>
    <p class="subtitle">Подзаголовок</p>
    <p class="meta-line">Автор · Год</p>
  </section>

  <section class="slide">
    <div class="slide-head"><span class="logo">◆</span><span class="page-ind">02</span></div>
    <h2>Демо-слайд</h2>
    <ul class="bullet-list">
      <li>Пункт первый</li>
      <li>Пункт второй</li>
    </ul>
  </section>

</div>

<div class="nav-hint">← → для навигации · клик по краям · свайп</div>

<script>
(() => {
  const deck = document.getElementById('deck');
  const progress = document.getElementById('progress');
  const slides = Array.from(deck.querySelectorAll('.slide'));
  let idx = slides.findIndex(s => s.classList.contains('active'));
  if (idx < 0) idx = 0;
  const show = (i) => {
    idx = (i + slides.length) % slides.length;
    slides.forEach((s, j) => s.classList.toggle('active', j === idx));
    if (progress) progress.style.width = ((idx + 1) / slides.length * 100) + '%';
  };
  const next = () => show(idx + 1);
  const prev = () => show(idx - 1);
  document.addEventListener('keydown', e => {
    if (e.key === 'ArrowRight' || e.key === ' ' || e.key === 'PageDown') { e.preventDefault(); next(); }
    else if (e.key === 'ArrowLeft' || e.key === 'PageUp') { e.preventDefault(); prev(); }
    else if (e.key === 'Home') show(0);
    else if (e.key === 'End') show(slides.length - 1);
  });
  deck.addEventListener('click', e => {
    const r = deck.getBoundingClientRect();
    if (e.clientX < r.left + r.width * 0.28) prev(); else next();
  });
  deck.addEventListener('wheel', e => {
    if (Math.abs(e.deltaY) < 8) return;
    e.deltaY > 0 ? next() : prev();
  }, { passive: true });
  let tx = 0;
  deck.addEventListener('touchstart', e => { tx = e.touches[0].clientX; }, { passive: true });
  deck.addEventListener('touchend', e => {
    const dx = e.changedTouches[0].clientX - tx;
    if (Math.abs(dx) > 40) dx < 0 ? next() : prev();
  }, { passive: true });
  show(idx);
})();
</script>
</body>
</html>
