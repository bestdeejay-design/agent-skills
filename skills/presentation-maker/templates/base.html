<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Презентация</title>
<!--FONT_LINK-->
<style>
:root {
    --danger: #FF3B30;
    --primary: #007AFF;
    --background: #FFFFFF;
    --card: #F5F5F7;
    --stroke: #E5E5EA;
    --on-primary: #FFFFFF;
    --text: #1C1C1E;
    --muted: #6E6E73;
    --accent-soft: #E8F0FE;
    --graph-0: #007AFF;
    --graph-1: #30B0C7;
    --graph-2: #5E5CE6;
    --graph-3: #34C759;
    --graph-4: #FF9500;
    --radius: 20px;
    --radius-sm: 12px;
    --radius-lg: 28px;
    --radius-full: 999px;
    --shadow: 0 8px 32px color-mix(in srgb, var(--primary) 12%, transparent), 0 2px 8px color-mix(in srgb, var(--primary) 8%, transparent);
    --shadow-hover: 0 16px 48px color-mix(in srgb, var(--primary) 18%, transparent), 0 4px 16px color-mix(in srgb, var(--primary) 12%, transparent);
    --shadow-soft: 0 1px 2px color-mix(in srgb, var(--primary) 6%, transparent), 0 2px 10px color-mix(in srgb, var(--primary) 8%, transparent);
    --font: "Inter", -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", Roboto, system-ui, sans-serif;
    --font-display: var(--font);
    --font-mono: "JetBrains Mono", ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;

    /* Design-system: spacing scale (4px base) */
    --s-1: 4px; --s-2: 8px; --s-3: 12px; --s-4: 16px; --s-5: 24px;
    --s-6: 32px; --s-7: 48px; --s-8: 64px; --s-9: 96px;

    /* Design-system: type scale (1600x900) */
    --t-display: clamp(52px, 8vw, 104px);
    --t-h1: clamp(44px, 6vw, 76px);
    --t-h2: clamp(30px, 4vw, 50px);
    --t-h3: clamp(19px, 2.4vw, 26px);
    --t-body: clamp(16px, 1.8vw, 19px);
    --t-meta: clamp(13px, 1.5vw, 16px);
    --t-caption: clamp(11px, 1.2vw, 13px);

    /* Design-system: contrast (WCAG) & hierarchy knobs */
    --eyebrow-track: .18em;
    --eyebrow-size: clamp(11px, 1.2vw, 13px);
    --duotone-a: var(--primary);
    --duotone-b: var(--graph-1);
    --grid-margin: clamp(56px, 6vw, 88px);
    --hairline: 1px solid var(--stroke);

    /* Style parameters (parametric layer): override per theme to change look */
    --card-style: raised;            /* raised | flat | outline | minimal */
    --heading-style: centered;       /* centered | left | rule | index */
    --bullet-style: dot;             /* dot | square | arrow | none */
    --metric-style: card;            /* card | plain | hero */
    --title-accent: bar;             /* bar | none | underline | glow */
    --decor: none;                   /* none | ovals | dots | grid | beams */
    --metric-color: var(--primary);
    --metric-align: center;
    --content-align: center;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { height: 100%; overflow: hidden; background: var(--background); color: var(--text);
    font-family: var(--font); -webkit-font-smoothing: antialiased; }
.deck { height: 100%; width: 100%; position: relative; }

.slide {
    position: absolute; inset: 0; display: flex; flex-direction: column;
    justify-content: center; align-items: center; padding: clamp(56px, 6vw, 88px);
    opacity: 0; visibility: hidden; transform: translateX(40px);
    transition: opacity .4s cubic-bezier(.22,1,.36,1), transform .4s cubic-bezier(.22,1,.36,1), visibility .4s;
}
.slide.active { opacity: 1; visibility: visible; transform: none; z-index: 1; }

.slide-head { position: absolute; top: 28px; left: 32px; right: 32px; display: flex;
    justify-content: space-between; align-items: center; pointer-events: none; }
.slide-head .logo { width: 30px; height: 30px; border-radius: 8px; display: inline-flex;
    align-items: center; justify-content: center; font-weight: 800; font-size: 15px;
    background: linear-gradient(135deg, var(--primary), var(--graph-1)); color: var(--on-primary); }
.slide-head .page-ind { font-weight: 700; font-size: 13px; color: var(--muted); opacity: .7;
    letter-spacing: .08em; }

h1, h2, h3 { font-weight: 800; letter-spacing: -.03em; line-height: 1.05; color: var(--text); }
h1, h2 { font-family: var(--font-display); }
h3 { font-family: var(--font-display); }
h1 { font-size: clamp(48px, 6.5vw, 82px); margin-bottom: 18px; }
h2 { font-size: clamp(32px, 4.2vw, 52px); margin-bottom: 14px; text-align: center; }
h3 { font-size: clamp(20px, 2.5vw, 27px); font-weight: 700; }
.subtitle { font-size: clamp(18px, 2.2vw, 24px); color: var(--muted); font-weight: 500;
    line-height: 1.38; margin-top: 10px; max-width: 920px; }
.meta-line { font-size: clamp(15px, 1.7vw, 19px); color: var(--muted); font-weight: 500;
    margin-top: 30px; opacity: .85; letter-spacing: .03em; }
.accent { color: var(--primary); }
.slide.title, .slide.closing, .slide.centered-header { text-align: center; }

/* gradient accent bar on title/closing */
.slide.title h1::after, .slide.closing h1::after {
    content: ""; display: block; width: 64px; height: 5px; border-radius: 3px; margin: 18px auto 0;
    background: linear-gradient(90deg, var(--primary), var(--graph-1));
}
/* --title-accent: none | underline | glow */
.title-accent-none .slide.title h1::after, .title-accent-none .slide.closing h1::after { display: none; }
.title-accent-underline .slide.title h1::after, .title-accent-underline .slide.closing h1::after {
    width: 100%; height: 3px; background: var(--primary); border-radius: 0;
}
.title-accent-glow .slide.title h1::after, .title-accent-glow .slide.closing h1::after {
    width: 120px; height: 12px; border-radius: 999px; filter: blur(6px); opacity: .8;
}

/* --heading-style: left | rule | index */
.heading-left h2 { text-align: left; }
.heading-rule h2 { text-align: left; position: relative; padding-bottom: 14px; }
.heading-rule h2::after { content: ""; position: absolute; left: 0; bottom: 0;
    width: 72px; height: 4px; border-radius: 2px; background: var(--primary); }
.heading-index h2 { text-align: left; position: relative; padding-left: 22px; }
.heading-index h2::before { content: ""; position: absolute; left: 0; top: 8px; bottom: 8px;
    width: 6px; border-radius: 3px; background: var(--primary); }

/* --card-style: flat | outline | minimal */
.card-style-flat .bullet-list li, .card-style-flat .col-card, .card-style-flat .step-card,
.card-style-flat .tl-card, .card-style-flat .metric-card, .card-style-flat .feature-card {
    box-shadow: none; border: 1px solid var(--stroke); background: var(--card);
}
.card-style-outline .bullet-list li, .card-style-outline .col-card, .card-style-outline .step-card,
.card-style-outline .tl-card, .card-style-outline .metric-card, .card-style-outline .feature-card {
    background: transparent; box-shadow: none;
}
.card-style-minimal .bullet-list li, .card-style-minimal .col-card, .card-style-minimal .step-card,
.card-style-minimal .tl-card, .card-style-minimal .metric-card, .card-style-minimal .feature-card {
    background: transparent; border: none; box-shadow: none; border-radius: 0;
    padding: 14px 8px; border-bottom: 1px solid var(--stroke);
}

/* --bullet-style: square | arrow | none */
.bullet-style-square .bullet-list li::before { border-radius: 2px; }
.bullet-style-arrow .bullet-list li::before { content: "→"; width: auto; height: auto;
    background: none; font-size: 18px; color: var(--primary); }
.bullet-style-none .bullet-list li::before { display: none; }
.bullet-style-none .bullet-list li { padding-left: 8px; }

/* --metric-style: plain | hero */
.metric-style-plain .metric-card { background: transparent; box-shadow: none; border: none; }
.metric-style-hero .metric-card { background: transparent; box-shadow: none; border: none;
    justify-content: flex-start; align-items: flex-start; text-align: left; }
.metric-style-hero .metric-value { font-size: clamp(56px, 8vw, 110px); font-weight: 900;
    letter-spacing: -.04em; line-height: .95; }
.metric-style-hero .metric-label { font-size: clamp(15px, 1.7vw, 19px); margin-top: 6px; }

/* --metric-color: tint metric values */
.metric-color-tint .metric-value { color: var(--primary); }
.metric-color-accent .metric-value { color: var(--accent, var(--primary)); }
.metric-color-muted .metric-value { color: var(--muted); }

/* --content-align: left for decks with left-aligned everything */
.content-align-left .slide { align-items: flex-start; text-align: left; }
.content-align-left .bullet-list { margin-left: 0; }

/* --decor: ovals | dots | grid | beams (background decorations) */
.slide.decor-ovals::before { content: ""; position: absolute; right: -140px; top: -140px;
    width: 420px; height: 420px; border-radius: 50%;
    background: radial-gradient(circle, var(--accent-soft), transparent 70%); opacity: .5; }
.slide.decor-ovals::after { content: ""; position: absolute; left: -120px; bottom: -120px;
    width: 320px; height: 320px; border-radius: 50%;
    background: radial-gradient(circle, var(--accent-soft), transparent 70%); opacity: .35; }
.slide.decor-dots::before { content: ""; position: absolute; right: 40px; top: 40px;
    width: 90px; height: 90px;
    background-image: radial-gradient(var(--muted) 1.5px, transparent 1.5px);
    background-size: 14px 14px; opacity: .25; }
.slide.decor-grid::before { content: ""; position: absolute; inset: 0;
    background-image: linear-gradient(var(--stroke) 1px, transparent 1px),
        linear-gradient(90deg, var(--stroke) 1px, transparent 1px);
    background-size: 80px 80px; opacity: .3; }
.slide.decor-beams::before { content: ""; position: absolute; inset: 0;
    background: linear-gradient(115deg, transparent 30%, var(--accent-soft) 45%,
        transparent 60%); opacity: .25; }
.slide.decor-diagonal::before { content: ""; position: absolute; inset: 0;
    background: linear-gradient(120deg, var(--primary) 0%, var(--primary) 38%, transparent 38.5%);
    opacity: .14; pointer-events: none; }
.slide.decor-diagonal::after { content: ""; position: absolute; inset: 0;
    background: linear-gradient(120deg, var(--graph-1) 0%, var(--graph-1) 38%, transparent 38.5%);
    opacity: .12; pointer-events: none; }
.slide.decor-duotone::before { content: ""; position: absolute; inset: 0;
    background: linear-gradient(160deg, var(--primary) 0%, var(--primary) 28%, transparent 29%);
    opacity: .18; pointer-events: none; }
.slide.decor-ovals, .slide.decor-dots, .slide.decor-grid, .slide.decor-beams,
.slide.decor-diagonal, .slide.decor-duotone { overflow: hidden; }
.slide.decor-ovals > *:not(.slide-head), .slide.decor-dots > *:not(.slide-head),
.slide.decor-grid > *:not(.slide-head), .slide.decor-beams > *:not(.slide-head),
.slide.decor-diagonal > *:not(.slide-head), .slide.decor-duotone > *:not(.slide-head) { position: relative; z-index: 1; }

/* ============================================================
   Layout patterns (generative compositions, one per .slide)
   Applied as .pat-<id> on <section class="slide ..."> by
   build_html.py pattern selector. Each pattern repositions the
   slide title and content block.
   ============================================================ */
.deck { counter-reset: slide; }
.slide { counter-increment: slide; }
.slide .pat-title, .slide > h1, .slide > h2 { transition: all .25s ease; }

/* bullets */
.bullet-list { list-style: none; display: flex; flex-direction: column; gap: 16px;
    width: 100%; max-width: 1000px; margin-top: 30px; text-align: left; }
.bullet-list li { display: flex; align-items: flex-start; gap: 20px; padding: 24px 30px;
    background: linear-gradient(135deg, var(--card), color-mix(in srgb, var(--card) 82%, var(--accent-soft)));
    border: 1px solid var(--stroke); border-radius: var(--radius-sm);
    font-size: clamp(16px, 1.9vw, 20px); line-height: 1.6; color: var(--text); letter-spacing: .005em;
    transition: border-color .2s, box-shadow .2s, transform .2s; position: relative; overflow: hidden; }
.bullet-list li::before { content: ""; flex-shrink: 0; width: 12px; height: 12px; border-radius: 50%;
    margin-top: 10px; background: var(--primary);
    box-shadow: 0 0 0 6px var(--accent-soft); }
.bullet-list li::after { content: ""; position: absolute; right: -30px; top: -30px;
    width: 110px; height: 110px; border-radius: 50%;
    background: radial-gradient(circle, var(--accent-soft), transparent 70%);
    opacity: .6; pointer-events: none; }
.bullet-list li:hover { border-color: var(--primary); box-shadow: var(--shadow);
    transform: translateX(5px); }
.bullet-list .bullet-text { flex: 1; position: relative; z-index: 1; }
.bullet-list .bullet-arrow { color: var(--primary); font-size: 20px; opacity: 0;
    transform: translateX(-6px); transition: opacity .2s, transform .2s; align-self: center; }
.bullet-list li:hover .bullet-arrow { opacity: 1; transform: none; }

/* ============================================================
   Structural templates — different HTML shapes per content type
   (spread, bars, fact-grid, menu, ladder, stats). Each is a
   genuinely different layout, chosen by composer.structure.
   ============================================================ */
/* spread — двухколоночный разворот с номерами */
.spread-grid { display: grid; grid-template-columns: 1fr 1fr; gap: clamp(20px, 3vw, 40px);
    width: 100%; max-width: 1150px; margin-top: 30px; }
.spread-col { display: flex; flex-direction: column; gap: 18px; }
.col-item { display: flex; align-items: flex-start; gap: 18px; padding: 18px 10px;
    border-bottom: 1px dashed var(--stroke); }
.col-num { flex-shrink: 0; font-size: 44px; font-weight: 900; line-height: 1;
    color: var(--primary); opacity: .25; }
.col-text { font-size: clamp(17px, 2vw, 21px); line-height: 1.5; font-weight: 600; }

/* bars — горизонтальные полосы с заполнением */
.bars-block { display: flex; flex-direction: column; gap: 22px; width: 100%;
    max-width: 1050px; margin-top: 34px; }
.bar-row { display: flex; align-items: center; gap: 20px; }
.bar-label { flex-shrink: 0; width: 34%; font-size: clamp(15px, 1.7vw, 18px); font-weight: 600;
    text-align: right; color: var(--text); }
.bar-track { flex: 1; height: 18px; border-radius: 10px; background: var(--accent-soft);
    overflow: hidden; position: relative; }
.bar-fill { display: block; height: 100%; width: var(--fill);
    background: linear-gradient(90deg, var(--primary), var(--graph-1));
    border-radius: 10px; }

/* fact-grid — сетка карточек-фактов 2×2 */
.fact-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px;
    width: 100%; max-width: 1100px; margin-top: 30px; }
.fact-card { position: relative; display: flex; align-items: center; gap: 18px;
    padding: 26px 30px; background: var(--card); border: 1px solid var(--stroke);
    border-radius: var(--radius-sm); overflow: hidden; }
.fact-num { flex-shrink: 0; width: 52px; height: 52px; border-radius: 14px;
    display: flex; align-items: center; justify-content: center;
    font-weight: 900; font-size: 20px; color: var(--on-primary);
    background: linear-gradient(135deg, var(--primary), var(--graph-1)); }
.fact-text { font-size: clamp(16px, 1.8vw, 19px); line-height: 1.5; font-weight: 600; }

/* menu — строки «значение — описание» */
.menu-block { display: flex; flex-direction: column; gap: 10px; width: 100%;
    max-width: 1050px; margin-top: 30px; }
.menu-row { display: flex; align-items: center; gap: 24px; padding: 20px 12px;
    border-bottom: 1px solid var(--stroke); }
.menu-value { flex-shrink: 0; width: 34%; font-size: clamp(30px, 3.6vw, 46px); font-weight: 900;
    color: var(--primary); letter-spacing: -.02em; }
.menu-dash { flex: 1; height: 2px; background: linear-gradient(90deg, var(--primary), var(--stroke)); opacity: .4; }
.menu-label { width: 44%; font-size: clamp(17px, 1.9vw, 20px); color: var(--text); font-weight: 500; }

/* ladder — лестница роста */
.ladder-block { display: flex; flex-direction: column; gap: 16px; width: 100%;
    max-width: 900px; margin-top: 34px; }
.ladder-step { display: flex; align-items: baseline; gap: 20px;
    padding: 14px 0 14px 8px; border-left: 6px solid var(--primary);
    background: linear-gradient(90deg, color-mix(in srgb, var(--primary) 12%, transparent), transparent);
    padding-left: 26px; }
.ladder-value { font-size: clamp(26px, 3.2vw, 40px); font-weight: 900; color: var(--text); }
.ladder-label { font-size: clamp(15px, 1.7vw, 18px); color: var(--muted); }

/* stats — инлайн-статистика */
.stats-block { display: flex; align-items: stretch; gap: 0; width: 100%;
    max-width: 1200px; margin-top: 40px; }
.stat-item { flex: 1; display: flex; flex-direction: column; align-items: center;
    justify-content: center; gap: 10px; padding: 28px 16px; text-align: center;
    border-left: 1px solid var(--stroke); }
.stat-item:first-child { border-left: none; }
.stat-value { font-size: clamp(30px, 4vw, 52px); font-weight: 900; color: var(--primary);
    letter-spacing: -.02em; }
.stat-label { font-size: clamp(14px, 1.6vw, 17px); color: var(--muted); }

/* metrics */

/* metrics */
/* metrics */
.metrics-grid { display: grid; gap: 20px; width: 100%; max-width: 1100px; margin-top: 30px; }
.metrics-2 { grid-template-columns: repeat(2, 1fr); }
.metrics-3 { grid-template-columns: repeat(3, 1fr); }
.metrics-4 { grid-template-columns: repeat(4, 1fr); }
.metric-card { display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 10px; padding: clamp(34px, 4vw, 48px) clamp(24px, 3vw, 36px); background:
        linear-gradient(180deg, color-mix(in srgb, var(--card) 85%, var(--accent-soft)), var(--card));
    border: 1px solid var(--stroke); border-radius: var(--radius); position: relative; overflow: hidden;
    transition: transform .25s ease, box-shadow .25s ease, border-color .25s ease; }
.metric-card::before { content: ""; position: absolute; top: 0; left: 0; right: 0; height: 5px;
    background: linear-gradient(90deg, var(--primary), var(--graph-1)); opacity: .9; }
.metric-card::after { content: ""; position: absolute; right: -46px; top: -46px; width: 140px; height: 140px;
    border-radius: 50%; background: radial-gradient(circle, var(--accent-soft), transparent 72%);
    opacity: .55; pointer-events: none; }
.metric-card:hover { transform: translateY(-6px); box-shadow: var(--shadow-hover); border-color: var(--primary); }
.metric-icon { width: 56px; height: 56px; border-radius: 16px; display: flex; align-items: center;
    justify-content: center; margin-bottom: 8px; color: var(--on-primary);
    background: linear-gradient(135deg, var(--primary), var(--graph-1));
    box-shadow: 0 4px 14px color-mix(in srgb, var(--primary) 35%, transparent); }
.metric-icon svg { width: 26px; height: 26px; display: block; filter: drop-shadow(0 1px 2px color-mix(in srgb, var(--primary) 25%, transparent)); }
.metric-value { font-size: clamp(30px, 3.8vw, 48px); font-weight: 800; letter-spacing: -.02em;
    color: var(--primary); line-height: 1.1; text-align: center; overflow-wrap: anywhere; max-width: 100%; }
.metric-value-sm { font-size: clamp(19px, 2.2vw, 27px); letter-spacing: -.01em; }
.metric-label { font-size: clamp(17px, 1.9vw, 20px); color: var(--muted); font-weight: 500;
    text-align: center; line-height: 1.3; }
@media (max-width: 900px) {
    .metrics-3, .metrics-4 { grid-template-columns: repeat(2, 1fr); }
}

/* comparison */
.columns { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
    gap: clamp(18px, 2.5vw, 30px); width: 100%; max-width: 1100px; margin-top: 28px; }
.col-card { display: flex; flex-direction: column; background: var(--card);
    border: 1px solid var(--stroke); border-radius: var(--radius); padding: 30px 30px 24px;
    transition: border-color .2s, box-shadow .2s, transform .2s; position: relative; overflow: hidden; }
.col-card::after { content: ""; position: absolute; left: 0; top: 0; bottom: 0; width: 5px;
    background: linear-gradient(180deg, var(--primary), var(--graph-1));
    opacity: 0; transition: opacity .2s; }
.col-card:hover { border-color: var(--primary); box-shadow: var(--shadow-hover); transform: translateY(-3px); }
.col-card:hover::after { opacity: 1; }
.col-card h3 { margin-bottom: 20px; padding-bottom: 16px; border-bottom: 2px solid var(--stroke);
    letter-spacing: -.01em; position: relative; font-size: clamp(22px, 2.6vw, 30px); }
.col-card h3::after { content: ""; position: absolute; left: 0; bottom: -2px; width: 48px; height: 3px;
    background: var(--primary); }
.col-card h3::before { content: attr(data-num); position: absolute; right: 0; top: -6px;
    font-size: 44px; font-weight: 900; color: var(--stroke); opacity: .6; line-height: 1; }
.col-card:nth-child(1) h3::after { background: var(--primary); }
.col-card:nth-child(2) h3::after { background: var(--accent, var(--graph-3)); }
.col-card li { list-style: none; display: flex; align-items: flex-start; gap: 12px;
    padding: 12px 0; font-size: clamp(17px, 2vw, 20px); line-height: 1.5;
    border-bottom: 1px dashed var(--stroke); }
.col-card li:last-child { border-bottom: none; }
.col-card li::before { content: "✕"; flex-shrink: 0; width: 22px; height: 22px; border-radius: 50%;
    display: inline-flex; align-items: center; justify-content: center; font-size: 11px; font-weight: 700;
    background: rgba(255,59,48,.12); color: var(--danger); margin-top: 2px; }
.col-card:nth-child(2) li::before { content: "✓"; background: rgba(52,199,89,.14); color: var(--graph-3); }
.col-card:nth-child(2) h3::before { content: "→ "; color: var(--primary); opacity: 1; }

/* table */
.table-wrap { width: 100%; max-width: 980px; margin-top: 26px; overflow: auto; }
table { width: 100%; border-collapse: separate; border-spacing: 0 10px;
    font-size: clamp(15px, 1.7vw, 17px); }
th { padding: 12px 20px; text-align: left; font-weight: 700; font-size: clamp(11px, 1.3vw, 13px);
    text-transform: uppercase; letter-spacing: .08em; color: var(--muted); }
td { padding: 17px 20px; background: var(--card); border: 1px solid var(--stroke); }
tr td:first-child { border-radius: var(--radius-sm) 0 0 var(--radius-sm); font-weight: 600; }
tr td:last-child { border-radius: 0 var(--radius-sm) var(--radius-sm) 0; color: var(--primary_text); font-weight: 600; }
tr { transition: transform .2s ease, box-shadow .2s ease; }
tr:hover td { border-color: var(--primary); }
tr:hover { transform: translateX(4px); box-shadow: var(--shadow-soft); }
/* highlighted column (e.g. "us" column in a comparison table) */
th.hl { color: var(--primary); }
th.hl, td.hl { background: var(--accent-soft); }
tr td.hl { color: var(--primary); font-weight: 700; }
tr:hover td.hl { border-color: var(--primary); }

/* chart */
.chart-wrap { display: flex; align-items: flex-end; gap: clamp(14px, 2vw, 26px);
    width: 100%; max-width: 980px; height: 320px; margin-top: 28px; padding: 0 8px; }
.bar-col { flex: 1; display: flex; flex-direction: column; align-items: center; gap: 10px; height: 100%; }
.bar { width: min(56px, 70%); border-radius: 8px 8px 3px 3px;
    background: linear-gradient(180deg, var(--graph-0), var(--graph-1)); transition: height .8s cubic-bezier(.22,1,.36,1); }
.bar-2 { background: linear-gradient(180deg, var(--graph-2), var(--graph-3)); }
.bar-3 { background: linear-gradient(180deg, var(--graph-1), var(--graph-4)); }
.bar-label { font-size: clamp(12px, 1.4vw, 14px); color: var(--muted); font-weight: 600; }
.bar-value { font-size: clamp(15px, 1.8vw, 19px); color: var(--text); font-weight: 800;
    letter-spacing: -.01em; font-variant-numeric: tabular-nums; }
.chart-note { margin-top: var(--s-6); font-size: clamp(14px, 1.6vw, 17px);
    color: var(--muted); font-weight: 500; text-align: center; max-width: 900px; line-height: 1.4; }

/* process / steps */
.steps { display: flex; flex-direction: column; gap: 18px; width: 100%; max-width: 920px;
    margin-top: 26px; position: relative; }
.steps::before { content: ""; position: absolute; left: 23px; top: 8px; bottom: 8px; width: 2px;
    background: linear-gradient(180deg, var(--primary), var(--graph-1)); opacity: .3; }
.step-card { display: flex; align-items: center; gap: 22px; padding: 22px 28px;
    background: var(--card); border: 1px solid var(--stroke); border-radius: var(--radius);
    transition: border-color .2s, box-shadow .2s, transform .2s; position: relative; }
.step-card:hover { border-color: var(--primary); box-shadow: var(--shadow-hover); transform: translateX(4px); }
.step-num { flex-shrink: 0; width: 46px; height: 46px; border-radius: 13px; display: flex;
    align-items: center; justify-content: center; font-weight: 800; font-size: 17px; color: var(--on-primary);
    background: linear-gradient(135deg, var(--primary), var(--graph-1));
    box-shadow: 0 4px 14px color-mix(in srgb, var(--primary) 40%, transparent); }
.step-text { font-size: clamp(17px, 2vw, 20px); line-height: 1.45; font-weight: 500; text-align: left; }
.step-arrow { position: absolute; right: 22px; color: var(--muted); opacity: .5; font-size: 20px; }

/* timeline */
.timeline { display: flex; gap: 0; width: 100%; max-width: 1100px; margin-top: 30px;
    position: relative; justify-content: space-between; }
.timeline::before { content: ""; position: absolute; top: 22px; left: 6%; right: 6%; height: 3px;
    background: var(--accent-soft); border-radius: 2px; }
.tl-item { flex: 1; display: flex; flex-direction: column; align-items: center; gap: 14px;
    text-align: center; padding: 0 10px; }
.tl-dot { width: 46px; height: 46px; border-radius: 50%; display: flex; align-items: center;
    justify-content: center; font-weight: 800; font-size: 15px; color: var(--on-primary);
    background: linear-gradient(135deg, var(--primary), var(--graph-1));
    box-shadow: 0 0 0 6px var(--accent-soft), 0 4px 14px color-mix(in srgb, var(--primary) 40%, transparent);
    z-index: 1; position: relative; }
.tl-dot::after { content: ""; position: absolute; inset: -8px; border-radius: 50%;
    border: 1px solid var(--primary); opacity: .4; }
.tl-card { width: 100%; background: var(--card); border: 1px solid var(--stroke);
    border-radius: var(--radius); padding: 18px 16px; transition: border-color .2s, box-shadow .2s; }
.tl-card:hover { border-color: var(--primary); box-shadow: var(--shadow); }
.tl-card strong { display: block; font-size: clamp(17px, 1.9vw, 20px); margin-bottom: 4px; }
.tl-card span { font-size: clamp(15px, 1.7vw, 17px); color: var(--muted); line-height: 1.4; display: block; }

/* image showcase */
.showcase { display: grid; grid-template-columns: 1fr 1fr; gap: clamp(24px, 3vw, 40px);
    width: 100%; max-width: 1100px; margin-top: 26px; align-items: center; }
.showcase-media { aspect-ratio: 16/10; border-radius: var(--radius); overflow: hidden;
    background: linear-gradient(135deg, var(--accent-soft), color-mix(in srgb, var(--primary) 18%, var(--card)));
    border: 1px solid var(--stroke); display: flex; align-items: center; justify-content: center;
    font-size: 56px; box-shadow: var(--shadow); }
.showcase-media img { width: 100%; height: 100%; object-fit: cover; }
.showcase-body h2 { text-align: left; margin-bottom: 16px; }
.showcase-body p { font-size: clamp(15px, 1.8vw, 18px); color: var(--muted); line-height: 1.55; }

/* kpi row */
.kpi-row { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
    gap: 18px; width: 100%; max-width: 1100px; margin-top: 28px; }
.kpi-card { padding: 24px 20px; background: var(--card); border: 1px solid var(--stroke);
    border-radius: var(--radius); text-align: center; transition: transform .25s, box-shadow .25s; }
.kpi-card:hover { transform: translateY(-4px); box-shadow: var(--shadow-hover); }
.kpi-value { font-size: clamp(30px, 4vw, 52px); font-weight: 800; letter-spacing: -.03em;
    color: var(--primary); line-height: 1.1; }
.kpi-label { font-size: clamp(13px, 1.5vw, 15px); color: var(--muted); margin-top: 6px; }

/* centered header */
.centered-header .subtitle-panel { margin: 22px auto 0; max-width: 760px; padding: 16px 28px;
    background: var(--accent-soft); border-radius: var(--radius-sm); font-size: clamp(15px, 1.8vw, 18px);
    color: var(--text); line-height: 1.5; }

/* closing */
.slide.closing h1 { margin-bottom: 0; }
.slide.closing .subtitle { margin-top: 20px; }

/* badges (optional) */
.badges { display: flex; flex-wrap: wrap; gap: 10px; justify-content: center; margin-top: 22px; }
.badge { padding: 8px 16px; border-radius: 100px; background: var(--card);
    border: 1px solid var(--stroke); font-size: clamp(12px, 1.4vw, 14px); font-weight: 600;
    color: var(--muted); }

/* ===== quote — крупный assertion-вывод ===== */
.quote-slide { text-align: center; max-width: 980px; }
.quote-mark { font-family: var(--font-display); font-size: clamp(64px, 9vw, 120px); line-height: .6;
    color: var(--primary); display: block; margin-bottom: var(--s-5); opacity: .9; }
.quote-text { font-family: var(--font-display); font-size: clamp(28px, 4vw, 48px); font-weight: 800;
    letter-spacing: -.02em; line-height: 1.18; color: var(--text); max-width: 900px; margin: 0 auto; }
.quote-attrib { margin-top: var(--s-5); color: var(--muted); font-size: clamp(15px, 1.7vw, 18px);
    font-weight: 500; }
.quote-attrib::before { content: "— "; }

/* ===== big-number — гигантский hero-показатель ===== */
.hero-num { text-align: center; }
.hero-num .hero-value { font-family: var(--font-mono); font-size: clamp(96px, 20vw, 220px);
    font-weight: 800; line-height: .9; letter-spacing: -.04em;
    background: linear-gradient(135deg, var(--text), var(--muted));
    -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent; }
.hero-num .hero-value--accent {
    background: linear-gradient(135deg, var(--primary), var(--graph-1));
    -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent; }
.hero-num .hero-label { margin-top: var(--s-4); font-size: clamp(20px, 2.6vw, 30px);
    font-weight: 600; color: var(--muted); }
.hero-num .hero-sub { margin-top: var(--s-2); font-size: clamp(14px, 1.6vw, 18px);
    color: var(--muted); opacity: .75; max-width: 640px; margin-left: auto; margin-right: auto; }

/* ===== feature — сетка возможностей (иконка+заголовок+текст) ===== */
.feature-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
    gap: clamp(16px, 2vw, 24px); width: 100%; max-width: 1120px; margin-top: var(--s-6); }
.feature-card { display: flex; flex-direction: column; gap: var(--s-3); padding: clamp(22px, 2.6vw, 32px);
    background: var(--card); border: 1px solid var(--stroke); border-radius: var(--radius); text-align: left;
    transition: border-color .2s, box-shadow .2s, transform .25s; }
.feature-card:hover { border-color: var(--primary); box-shadow: var(--shadow-hover); transform: translateY(-4px); }
.feature-icon { width: 48px; height: 48px; border-radius: 12px; display: flex; align-items: center;
    justify-content: center; color: var(--primary); background: var(--accent-soft); }
.feature-icon svg { width: 22px; height: 22px; display: block; }
.feature-card h3 { font-size: clamp(17px, 2vw, 22px); font-weight: 700; }
.feature-card p { font-size: clamp(16px, 1.8vw, 18px); color: var(--muted); line-height: 1.5; }

/* ===== logos — сетка партнёров/брендов ===== */
.logo-grid { display: flex; flex-wrap: wrap; justify-content: center; gap: clamp(14px, 2vw, 24px);
    width: 100%; max-width: 1000px; margin-top: var(--s-6); }
.logo-tile { min-width: 150px; padding: clamp(16px, 2vw, 24px) clamp(20px, 2.5vw, 32px);
    background: var(--card); border: 1px solid var(--stroke); border-radius: var(--radius);
    display: flex; align-items: center; justify-content: center; font-weight: 700;
    font-size: clamp(14px, 1.8vw, 18px); color: var(--muted);
    transition: border-color .2s, color .2s, transform .25s; text-align: center; }
.logo-tile:hover { border-color: var(--primary); color: var(--text); transform: translateY(-3px); }
.logo-note { margin-top: var(--s-4); font-size: clamp(12px, 1.4vw, 14px); color: var(--muted); opacity: .8; text-align: center; }

/* ===== table-of-contents — оглавление/агенда ===== */
.toc-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
    gap: clamp(14px, 2vw, 22px); width: 100%; max-width: 1000px; margin-top: var(--s-6); }
.toc-item { display: flex; gap: var(--s-4); align-items: baseline; padding: var(--s-4) var(--s-5);
    background: var(--card); border: 1px solid var(--stroke); border-radius: var(--radius-sm);
    transition: border-color .2s, transform .2s; }
.toc-item:hover { border-color: var(--primary); transform: translateX(4px); }
.toc-num { font-family: var(--font-mono); font-weight: 800; font-size: clamp(16px, 1.9vw, 22px);
    color: var(--primary); min-width: 2ch; }
.toc-title { font-size: clamp(16px, 1.9vw, 20px); font-weight: 700; }
.toc-desc { font-size: clamp(13px, 1.5vw, 15px); color: var(--muted); margin-top: 2px; }

/* ===== feature list — слева текст, справа ключевые пункты с галочками ===== */
.hero .feature-list { list-style: none; display: flex; flex-direction: column; gap: var(--s-3);
    margin-top: var(--s-5); text-align: left; max-width: 720px; margin-left: auto; margin-right: auto; }
.feature-list li { display: flex; align-items: center; gap: var(--s-3); padding: var(--s-3) var(--s-4);
    background: var(--card); border: 1px solid var(--stroke); border-radius: var(--radius-sm);
    font-size: clamp(15px, 1.8vw, 18px); font-weight: 500; }
.feature-list li::before { content: ""; flex-shrink: 0; width: 22px; height: 22px; border-radius: 50%;
    background: var(--graph-3); color: var(--background);
    background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='white' stroke-width='3.5' stroke-linecap='round' stroke-linejoin='round'><path d='M20 6L9 17l-5-5'/></svg>");
    background-size: 12px; background-position: center; background-repeat: no-repeat; }

/* progress bar */
.progress { position: fixed; top: 0; left: 0; height: 3px; background: linear-gradient(90deg, var(--primary), var(--graph-1));
    z-index: 60; transition: width .35s cubic-bezier(.22,1,.36,1); }

/* nav hint */
.nav-hint { position: fixed; bottom: 18px; left: 50%; transform: translateX(-50%);
    color: var(--muted); opacity: .55; font-size: 12px; letter-spacing: .04em;
    user-select: none; pointer-events: none; white-space: nowrap; }

@media (max-width: 820px) {
    .showcase { grid-template-columns: 1fr; }
    .timeline { flex-direction: column; gap: 16px; }
    .timeline::before { display: none; }
    .bullet-list li { align-items: flex-start; }
}
/* ===== Design-system: typographic helpers ===== */
/* eyebrow / kicker — маленький капс-лейбл над заголовком */
.eyebrow, .kicker { display: inline-block; font-family: var(--font-display);
    font-size: var(--eyebrow-size); font-weight: 700; letter-spacing: var(--eyebrow-track);
    text-transform: uppercase; text-align: center; color: var(--muted);
    margin-bottom: var(--s-3); }
.eyebrow--accent { color: var(--primary); }
/* mono numbers for metrics/timeline labels */
.mono { font-family: var(--font-mono); font-variant-numeric: tabular-nums; }
/* hairline divider */
.hairline { border: 0; border-top: var(--hairline); margin: var(--s-5) auto; width: 100%; }

/* duotone image tint — Stripe/Duolingo editorial look
   Обёртка: <div class="duotone" style="background: var(--duotone-a)"><img ...></div>
   Фото/моно тонируется двумя брендовыми тонами через blend. */
.duotone { position: relative; overflow: hidden; }
.duotone img { width: 100%; height: 100%; object-fit: cover; filter: grayscale(1) contrast(1.12); mix-blend-mode: multiply; opacity: .94; }
.duotone::after { content: ""; position: absolute; inset: 0;
    background: linear-gradient(120deg, var(--duotone-a), var(--duotone-b));
    mix-blend-mode: screen; opacity: .55; pointer-events: none; }

/* index numerals (editorial / swiss) — большой серийный номер */
.index-num { position: absolute; top: var(--s-4); right: var(--s-6); font-family: var(--font-mono);
    font-size: clamp(56px, 7vw, 96px); font-weight: 800; color: var(--stroke); opacity: .55; line-height: 1; }

/* ===== design-system: aesthetic moods (data-mood) =====
   Каждый mood переопределяет характер шаблона ПОВЕРХ темы через токены.
   Применяется к блоку .deck (атрибут data-mood выбрал build_html по темы/mood). */

/* SWISS — International Typographic: острая сетка, хайр-лайны, жёсткие радиусы, красный акцент */
.deck[data-mood="swiss"] {
    --radius: 6px; --radius-sm: 2px; --radius-lg: 6px;
    --eyebrow-track: .12em;
    --shadow: none; --shadow-hover: 0 4px 20px color-mix(in srgb, var(--primary) 14%, transparent);
    --font-display: var(--font);
}
.deck[data-mood="swiss"] h1, .deck[data-mood="swiss"] h2, .deck[data-mood="swiss"] h3 { letter-spacing: -.015em; }
.deck[data-mood="swiss"] .metric-value, .deck[data-mood="swiss"] .kpi-value { letter-spacing: -.02em; font-variant-numeric: tabular-nums; }
.deck[data-mood="swiss"] .bullet-list li, .deck[data-mood="swiss"] .col-card,
.deck[data-mood="swiss"] .step-card, .deck[data-mood="swiss"] .tl-card,
.deck[data-mood="swiss"] .kpi-card { border-width: 1px; border-radius: var(--radius); box-shadow: none; }

/* EDITORIAL / DUOTONE — журнальная полоса: сериф-дисплей, воздух, даутон, индекс-номера */
.deck[data-mood="editorial"] {
    --radius: 4px; --radius-sm: 2px; --radius-lg: 6px;
    --shadow: var(--shadow-soft); --shadow-hover: 0 12px 32px color-mix(in srgb, var(--primary) 18%, transparent);
    --eyebrow-track: .08em;
}
.deck[data-mood="editorial"] h1, .deck[data-mood="editorial"] h2 { letter-spacing: -.005em; font-family: var(--font-display); }
.deck[data-mood="editorial"] .slide-head { top: var(--s-5); left: var(--s-6); right: var(--s-6); }

/* FLAT / UI-KIT — Linear-бенто: мягкие крупные радиусы, почти без теней, тонкие линии */
.deck[data-mood="flat"] {
    --radius: 20px; --radius-sm: 14px; --radius-lg: 28px;
    --shadow: none; --shadow-hover: 0 8px 24px color-mix(in srgb, var(--primary) 12%, transparent);
    --eyebrow-track: .16em;
}
.deck[data-mood="flat"] .bullet-list li, .deck[data-mood="flat"] .col-card,
.deck[data-mood="flat"] .step-card, .deck[data-mood="flat"] .tl-card,
.deck[data-mood="flat"] .kpi-card { box-shadow: none; }
.deck[data-mood="flat"] .metric-icon { border-radius: var(--radius-sm); }

/* GLASS — glassmorphism: полупрозрачные карточки над градиентным фоном */
.deck[data-mood="glass"] {
    --radius: 24px; --radius-sm: 16px; --radius-lg: 32px;
    --shadow: 0 8px 32px color-mix(in srgb, var(--primary) 20%, transparent), inset 0 1px 0 rgba(255,255,255,.18);
    --shadow-hover: 0 16px 48px color-mix(in srgb, var(--primary) 26%, transparent), inset 0 1px 0 rgba(255,255,255,.2);
}
.deck[data-mood="glass"] .metric-card, .deck[data-mood="glass"] .col-card,
.deck[data-mood="glass"] .step-card, .deck[data-mood="glass"] .tl-card,
.deck[data-mood="glass"] .kpi-card, .deck[data-mood="glass"] .bullet-list li {
    background: color-mix(in srgb, var(--card) 68%, transparent);
    -webkit-backdrop-filter: blur(18px); backdrop-filter: blur(18px);
    border: 1px solid color-mix(in srgb, var(--stroke) 55%, transparent);
}

/* DARK CONSOLE — developer: тёмный фон, неоновые акценты, моно-числа */
.deck[data-mood="dark"] {
    --radius: 16px; --radius-sm: 10px; --radius-lg: 22px;
    --eyebrow-track: .14em;
    --font-display: var(--font);
}
.deck[data-mood="dark"] .metric-value, .deck[data-mood="dark"] .kpi-value { font-family: var(--font-mono); letter-spacing: -.02em; }
.deck[data-mood="dark"] .step-num, .deck[data-mood="dark"] .tl-dot { color: var(--background);
    box-shadow: 0 0 0 6px color-mix(in srgb, var(--primary) 14%, transparent); }

/* Готовые комбинации шрифт-семейств для важных mood
   (display назначается из темы как --font-display и/или --font). */

/* ============================================================
   Component variants — each slide assembles independent atoms
   (title, marker, card, metric, bg, accent, num). The composer
   picks a variant per component, so combinations explode.
   ============================================================ */

/* ---- Заголовок: 6 вариантов подачи ---- */
/* line — hairline-подчёркивание */
.title-line > h1, .title-line > h2 { position: relative; padding-bottom: .4em; }
.title-line > h1::after, .title-line > h2::after { content: ""; position: absolute;
    left: 0; bottom: 0; height: 4px; width: 72px; border-radius: 2px;
    background: linear-gradient(90deg, var(--primary), var(--graph-1)); }
/* number — номер-эпиграф слева */
.title-number > h1, .title-number > h2 { position: relative; padding-left: 1.4em; }
.title-number > h1::before, .title-number > h2::before { content: counter(slide, decimal-leading-zero);
    position: absolute; left: 0; top: 0; font-size: .55em; font-weight: 900;
    color: var(--primary); opacity: .4; }
/* caps — капс-плашка */
.title-caps > h1, .title-caps > h2 { text-transform: uppercase; letter-spacing: .12em;
    font-weight: 900; }
.title-caps > h1::before, .title-caps > h2::before { content: ""; display: block;
    width: 56px; height: 8px; border-radius: 2px; background: var(--primary);
    margin-bottom: 18px; }
/* rail — цветная полоса слева */
.title-rail > h1, .title-rail > h2 { position: relative; padding-left: 1.2em; }
.title-rail > h1::before, .title-rail > h2::before { content: ""; position: absolute;
    left: 0; top: .15em; bottom: .15em; width: 6px; border-radius: 3px;
    background: var(--accent, var(--primary)); }
/* bgword — фоновое слово за заголовком */
.title-bgword > h1, .title-bgword > h2 { position: relative; z-index: 1; }
.title-bgword > h1::after, .title-bgword > h2::after { content: attr(data-bg);
    position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%);
    font-size: 4.5em; font-weight: 900; color: var(--stroke); opacity: .5;
    white-space: nowrap; z-index: -1; }
/* vertical — вертикальный заголовок-колонка */
.title-vertical > h1, .title-vertical > h2 { writing-mode: vertical-rl;
    border-left: 5px solid var(--primary); padding-left: 14px; }

/* ---- Маркер списка: 6 вариантов ---- */
/* dash — тонкое тире */
.marker-dash .bullet-list li::before { content: "—"; background: none; box-shadow: none;
    width: auto; height: auto; font-size: 26px; font-weight: 300; color: var(--primary); }
.marker-dash .bullet-list li::after { display: none; }
/* square — квадрат */
.marker-square .bullet-list li::before { border-radius: 3px; }
/* icon — иконка-стрелка */
.marker-icon .bullet-list li::before { content: "→"; background: none; box-shadow: none;
    width: auto; height: auto; font-size: 24px; font-weight: 700; color: var(--primary); }
/* number — номер в плашке */
.marker-number .bullet-list li::before { content: attr(data-num); width: 46px; height: 46px;
    border-radius: 12px; font-size: 18px; font-weight: 900; color: var(--on-primary);
    margin-top: 0; }
/* none — без маркера, отступ */
.marker-none .bullet-list li::before { display: none; }
.marker-none .bullet-list li { padding-left: 8px; }

/* ---- Карточка: 6 вариантов ---- */
/* border — чистая рамка */
.card-border .bullet-list li, .card-border .metric-card, .card-border .col-card,
.card-border .step-card, .card-border .tl-card { background: transparent; box-shadow: none; }
/* shadow — мягкая тень */
.card-shadow .bullet-list li, .card-shadow .metric-card, .card-shadow .col-card,
.card-shadow .step-card, .card-shadow .tl-card { border-color: transparent; box-shadow: var(--shadow); }
/* edge — акцентная кромка сверху */
.card-edge .bullet-list li, .card-edge .metric-card, .card-edge .col-card,
.card-edge .step-card, .card-edge .tl-card { border-top: 5px solid var(--primary); }
/* gradient — градиентная подложка */
.card-gradient .bullet-list li, .card-gradient .metric-card { border: none;
    background: linear-gradient(135deg, color-mix(in srgb, var(--primary) 10%, var(--card)),
        color-mix(in srgb, var(--accent, var(--primary)) 8%, var(--card))); }
/* flat — без рамок, разделители */
.card-flat .bullet-list li, .card-flat .metric-card, .card-flat .col-card,
.card-flat .step-card, .card-flat .tl-card { background: transparent; border: none;
    box-shadow: none; border-bottom: 1px solid var(--stroke); border-radius: 0; }


/* ---- Метрика: 6 вариантов ---- */
/* big — гигантская цифра */
.metric-big .metric-value { font-size: clamp(56px, 8vw, 110px); font-weight: 900; }
.metric-big .metric-card { background: transparent; border: none; box-shadow: none; }
.metric-big .metric-card::before, .metric-big .metric-card::after { display: none; }
/* inline — цифра в строке с описанием */
.metric-inline .metric-card { flex-direction: row; justify-content: flex-start;
    align-items: baseline; gap: 22px; text-align: left; padding: 20px 28px; }
.metric-inline .metric-value { font-size: clamp(34px, 4.4vw, 56px); text-align: left; }
.metric-inline .metric-label { text-align: left; }
/* delta — цифра + дельта */
.metric-delta .metric-card { position: relative; }
.metric-delta .metric-label::after { content: " ▲"; color: var(--graph-3); font-weight: 800; }
/* spark — цифра + мини-линия */
.metric-spark .metric-value { position: relative; }
.metric-spark .metric-value::after { content: ""; display: block; width: 100%; height: 6px;
    margin-top: 10px; border-radius: 3px;
    background: linear-gradient(90deg, var(--primary), var(--graph-1)); }
/* tile — плитка с иконкой (стандарт) */
.metric-tile .metric-card { align-items: center; }

<!--PATTERN_CSS-->

/* ============================================================
   Accent embedding (second brand color, var(--accent), e.g. rose)
   Three ways to weave the accent without mixing with primary:
   accent-word (whole first title word), accent-underline (hairline
   under title), accent-icons (metric icons + values on light cards).
   Rule: an accent never sits on top of another accent; on accent
   backgrounds text is always on-primary.
   ============================================================ */
.accent-word > h1 .accent-word, .accent-word > h2 .accent-word {
    color: var(--accent, var(--primary));
}
.accent-underline > h1, .accent-underline > h2 { position: relative; padding-bottom: .35em; }
.accent-underline > h1::after, .accent-underline > h2::after {
    content: ""; position: absolute; left: 0; bottom: 0;
    width: 64px; height: 4px; border-radius: 2px;
    background: var(--accent, var(--primary));
}
.accent-icons .metric-icon {
    background: var(--accent-soft);
    color: var(--accent, var(--primary));
}
.accent-icons .metric-icon svg { fill: currentColor; }
.accent-icons .metric-card .metric-value { color: var(--accent, var(--primary)); }
.slide.pat-card-dashboard.accent-icons > .metrics-grid .metric-card:nth-child(1) .metric-value,
.slide.pat-card-dashboard.accent-icons > .metrics-grid .metric-card:nth-child(1) .metric-icon {
    color: var(--on-primary);
    background: transparent;
}
.slide.pat-card-dashboard.accent-icons > .metrics-grid .metric-card:nth-child(1) .metric-icon svg {
    fill: var(--on-primary);
}

/* ============================================================
   Per-pattern element styling: each pattern gives its cards,
   lists and metrics a distinct character (glass, borders,
   edges, numbers, lines) — not just layout.
   ============================================================ */

/* hero-left — editorial: clean cards, no fill, left hairline */
.slide.pat-hero-left > .bullet-list li { background: transparent; border: none;
    border-left: 3px solid var(--primary); border-radius: 0; padding: 18px 24px; }
.slide.pat-hero-left > .bullet-list li::before { display: none; }
.slide.pat-hero-left > .metric-card { border-radius: 4px; border-left: 5px solid var(--primary); }

/* editorial-asym — magazine: ghost number, hairline top, airy */
.slide.pat-editorial-asym > h2 { border-top: 4px solid var(--primary); padding-top: 24px; }
.slide.pat-editorial-asym > .bullet-list li { background: transparent; border: none;
    border-bottom: 1px solid var(--stroke); border-radius: 0; padding: 18px 4px; }
.slide.pat-editorial-asym > .bullet-list li::before { display: none; }

/* swiss-grid — strict: flat, squared, hairline separators */
.slide.pat-swiss-grid > .bullet-list li { background: transparent; border: 1px solid var(--stroke);
    border-radius: 0; box-shadow: none; }
.slide.pat-swiss-grid > .bullet-list li::before { border-radius: 0; box-shadow: none; }
.slide.pat-swiss-grid > .metric-card { border-radius: 0; border: 1px solid var(--stroke); }
.slide.pat-swiss-grid > .metric-card::before { height: 3px; }

/* z-pattern — editorial blocks: corner accents */
.slide.pat-z-pattern > .bullet-list li { background: var(--card); border: 1px solid var(--stroke); }
.slide.pat-z-pattern > .bullet-list li:nth-child(1),
.slide.pat-z-pattern > .bullet-list li:nth-child(4) { background: var(--primary); color: var(--on-primary);
    border-color: var(--primary); }
.slide.pat-z-pattern > .bullet-list li:nth-child(1)::before,
.slide.pat-z-pattern > .bullet-list li:nth-child(4)::before { background: var(--on-primary);
    box-shadow: 0 0 0 6px color-mix(in srgb, var(--on-primary) 25%, transparent); }

/* split-diagonal — fintech: glass panels, glow */
.slide.pat-split-diagonal > .bullet-list li,
.slide.pat-split-diagonal > .metric-card { background: color-mix(in srgb, var(--card) 82%, transparent);
    backdrop-filter: blur(6px); border: 1px solid var(--stroke); }

/* big-type — minimal: no cards at all, giant text */
.slide.pat-big-type > .bullet-list li { background: transparent; border: none; box-shadow: none; }
.slide.pat-big-type > .bullet-list li::before { display: none; }
.slide.pat-big-type > .metric-card { background: transparent; border: none; box-shadow: none; }
.slide.pat-big-type > .metric-card::before { display: none; }

/* card-dashboard — glass: frosted tiles */
.slide.pat-card-dashboard > .metric-card,
.slide.pat-card-dashboard > .bullet-list li { background: color-mix(in srgb, var(--card) 75%, transparent);
    backdrop-filter: blur(10px); border: 1px solid color-mix(in srgb, var(--stroke) 70%, transparent); }

/* vertical-rail — minimal: rail line, flat list */
.slide.pat-vertical-rail > .bullet-list li { background: transparent; border: none;
    border-bottom: 1px solid var(--stroke); border-radius: 0; padding: 16px 8px; }
.slide.pat-vertical-rail > .bullet-list li::before { display: none; }

/* split-frame — editorial: media split, subtle cards */
.slide.pat-split-frame > .bullet-list li { background: transparent; border: none;
    border-left: 3px solid var(--accent, var(--primary)); border-radius: 0; }
.slide.pat-split-frame > .bullet-list li::before { display: none; }

/* sparkline-metric — minimal: number + rule */
.slide.pat-sparkline-metric > .metric-card { background: transparent; border: none;
    box-shadow: none; border-bottom: 4px solid var(--primary); border-radius: 0; }
.slide.pat-sparkline-metric > .metric-card::before { display: none; }

/* before-after — contrast: left muted, right accent */
.slide.pat-before-after > .col-card:nth-child(1) { background: transparent; border-color: var(--stroke); }
.slide.pat-before-after > .col-card:nth-child(2) { background: var(--accent-soft);
    border-color: var(--accent, var(--primary)); }

/* vertical-stepper — process: step dots, connected */
.slide.pat-vertical-stepper > .steps-wrap { margin-left: 40px; }
.slide.pat-vertical-stepper .step-card { background: var(--card); border-left: 4px solid var(--primary); }

/* zigzag-timeline — editorial: alternating accent bands */
.slide.pat-zigzag-timeline .tl-card { background: var(--card); border-left: 4px solid var(--primary); }
.slide.pat-zigzag-timeline .tl-item:nth-child(even) .tl-card { border-left: none;
    border-right: 4px solid var(--accent, var(--primary)); }

/* quote-hero — editorial: no card, giant mark, serif */
.slide.pat-quote-hero .quote-text { font-size: clamp(36px, 5.5vw, 64px); }
.slide.pat-quote-hero .quote-mark { opacity: .15; }

/* recap-grid — minimal: 2x2, one accent cell */
.slide.pat-recap-grid > .bullet-list li { background: var(--card); border: 1px solid var(--stroke); }
.slide.pat-recap-grid > .bullet-list li:nth-child(1) { background: var(--primary); color: var(--on-primary);
    border-color: var(--primary); }

/* soft-shapes — minimal: blurred ovals, airy cards */
.slide.pat-soft-shapes > .metric-card { background: color-mix(in srgb, var(--card) 80%, transparent);
    backdrop-filter: blur(8px); }

/* data-story — fintech: annotation, left border */
.slide.pat-data-story > .metric-card { border-left: 5px solid var(--primary); }
.slide.pat-data-story > .bullet-list li { background: transparent; border: none;
    border-left: 3px solid var(--primary); border-radius: 0; }

/* cyclic-process — editorial: ring steps */
.slide.pat-cyclic-process .step-card { background: var(--card); border: 1px solid var(--stroke);
    border-radius: 50% 8px 50% 8px; }


</style>
</head>
<body>
<div class="progress" id="progress"></div>
<div class="deck" id="deck">
  <!--SLIDES-->
<div class="nav-hint">← → для навигации · клик по краям · свайп</div>

<script>
(() => {
  const deck = document.getElementById('deck');
  const progress = document.getElementById('progress');
  const slides = Array.from(deck.querySelectorAll('.slide'));
  let idx = slides.findIndex(s => s.classList.contains('active'));
  if (idx < 0) idx = 0;
  const show = (i) => {
    idx = (i + slides.length) % slides.length;
    slides.forEach((s, j) => s.classList.toggle('active', j === idx));
    if (progress) progress.style.width = ((idx + 1) / slides.length * 100) + '%';
  };
  const next = () => show(idx + 1);
  const prev = () => show(idx - 1);
  document.addEventListener('keydown', e => {
    if (e.key === 'ArrowRight' || e.key === ' ' || e.key === 'PageDown') { e.preventDefault(); next(); }
    else if (e.key === 'ArrowLeft' || e.key === 'PageUp') { e.preventDefault(); prev(); }
    else if (e.key === 'Home') show(0);
    else if (e.key === 'End') show(slides.length - 1);
  });
  deck.addEventListener('click', e => {
    const r = deck.getBoundingClientRect();
    if (e.clientX < r.left + r.width * 0.28) prev(); else next();
  });
  deck.addEventListener('wheel', e => {
    if (Math.abs(e.deltaY) < 8) return;
    e.deltaY > 0 ? next() : prev();
  }, { passive: true });
  let tx = 0;
  deck.addEventListener('touchstart', e => { tx = e.touches[0].clientX; }, { passive: true });
  deck.addEventListener('touchend', e => {
    const dx = e.changedTouches[0].clientX - tx;
    if (Math.abs(dx) > 40) dx < 0 ? next() : prev();
  }, { passive: true });
  show(idx);
})();
</script>
</body>
</html>
