name: Validate Skills

on:
  push:
    branches:
      - main
      - "arena/**"
  pull_request:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Validate skills
        run: python3 scripts/validate_skills.py --all

      - name: Compile Python scripts
        run: python3 -m compileall -q scripts skills

      - name: Check quality snapshot is current
        run: |
          python3 scripts/skill_quality_audit.py
          git diff --exit-code -- docs/skill-quality-audit.md
